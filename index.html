<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Cells Teamed Up | Prokaryotes, Eukaryotes, Endosymbiosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12304A;
  --water-top:#3FB8C9;
  --water-deep:#16507A;
  --host:#FFB5A7;
  --coral:#FF6B6B;
  --leaf:#5BD16B;
  --sun:#FFD23F;
  --panel:#F1FBFA;
  --purple:#8E6BE0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif;
  font-size:18px;
  line-height:1.5;
  color:var(--ink);
  min-height:100vh;
  background:linear-gradient(180deg,#0F4C73 0%,#0A2F4C 100%);
}
h1,h2,.btn{font-family:'Fredoka','Nunito',system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px 18px 40px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
header h1{margin:0;font-size:30px;font-weight:600;color:#fff;letter-spacing:.2px}
header .dot{width:34px;height:34px;border-radius:50%;background:var(--host);border:3px solid var(--ink);position:relative;flex:none}
header .dot::after{content:"";position:absolute;left:15px;top:13px;width:11px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}

main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:20px;align-items:stretch}
@media (max-width:900px){main{grid-template-columns:1fr}}

.stage-col{align-self:start;min-width:0}
.stage-tools{display:flex;justify-content:flex-end;margin-top:14px}
#gamegrid:fullscreen{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;padding:16px;width:100vw;height:100vh;box-sizing:border-box;
  background:linear-gradient(180deg,#0F4C73 0%,#0A2F4C 100%);align-items:center;overflow:hidden}
#gamegrid:fullscreen .stage-col{align-self:center;display:flex;flex-direction:column;align-items:center;width:100%}
#gamegrid:fullscreen .stage-frame{width:min(100%,calc((100vh - 96px) * 16 / 9))}
#gamegrid:fullscreen .stage-tools{width:min(100%,calc((100vh - 96px) * 16 / 9))}
#gamegrid:fullscreen .panel{height:calc(100vh - 32px);overflow-y:auto;min-height:0}
.stage-frame{border:4px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 var(--ink);background:var(--water-deep);align-self:start}
#stage{display:block;width:100%;height:auto}

.panel{
  background:var(--panel);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
  padding:20px 22px 18px;display:flex;flex-direction:column;min-height:440px
}
.panel .content{flex:1}
.panel h2{margin:12px 0 8px;font-size:28px;line-height:1.15;font-weight:600}
.panel p{margin:0 0 10px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:9px;border-radius:6px;background:#CFE8EA;border:2px solid var(--ink)}
.prog i.on{background:var(--leaf)}
.vocab{background:#E8F9D9;border:3px solid var(--ink);border-radius:16px;padding:9px 14px;margin:12px 0;font-size:17px}
.vocab b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{
  font-size:19px;font-weight:600;color:var(--ink);background:var(--sun);
  border:3px solid var(--ink);border-radius:999px;padding:10px 24px;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.clue:focus-visible,.opt:focus-visible{outline:4px solid #7B4FD8;outline-offset:3px}
.btn.big{font-size:22px;padding:13px 30px}

.clues{display:grid;gap:8px;margin:10px 0}
.clue{
  text-align:left;font:600 17px 'Fredoka',sans-serif;color:var(--ink);background:#fff;
  border:3px solid var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px
}
.clue.active{background:#FFF1B8}
.clue.done .tick{visibility:visible}
.tick{visibility:hidden;width:24px;height:24px;border-radius:50%;background:var(--leaf);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.clue-text{background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;min-height:92px;font-size:17px}
.found{font-size:16px;margin:6px 0 0;font-weight:700}

.cards{display:grid;gap:10px;margin:10px 0}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:17px}
.card b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;display:block}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:15px;font-weight:700;margin:3px 4px 0 0}
.pill.m{background:#FFC2C2}.pill.c{background:#C4F0CB}
.words{font-size:16px;margin-top:8px}

.opts{display:grid;gap:10px;margin:12px 0}
.opt{
  text-align:left;font:700 17px 'Nunito',sans-serif;color:var(--ink);background:#fff;
  border:3px solid var(--ink);border-radius:16px;padding:10px 14px;cursor:pointer;
  box-shadow:0 3px 0 var(--ink)
}
.opt:disabled{cursor:default}
.opt.correct{background:#CDF5C6}
.opt.wrong{background:#FFD2CD}
.feedback{min-height:70px;background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:9px 13px;font-size:17px}
.feedback strong{font-family:'Fredoka',sans-serif;font-weight:600}
.badges{display:flex;gap:8px;margin:10px 0}
.badge{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#D8E8EA;display:flex;align-items:center;justify-content:center;font-weight:700}
.badge.on{background:var(--sun)}

/* ---------- Stage animation ---------- */
.mover{transition:transform 1.8s cubic-bezier(.5,0,.2,1),opacity .8s ease}
.bob{animation:bob 3.2s ease-in-out infinite}
#bactC .bob{animation-delay:-1.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bub{animation:rise 14s linear infinite;opacity:.5}
@keyframes rise{from{transform:translateY(40px)}to{transform:translateY(-480px)}}
.bounce{animation:squish .5s ease}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.07,.93)}70%{transform:scale(.97,1.04)}100%{transform:scale(1)}}

.bulge{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .8s,transform 1.4s ease}
.bulgeOn .bulge{opacity:1;transform:scale(1)}
.nuc{opacity:0;transition:opacity 1.2s}
.nucOn .nuc{opacity:1}
#sun{opacity:0;transition:opacity 1.2s}
.sunOn #sun{opacity:1}
.rays{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#beam{opacity:0;transition:opacity 1s;animation:dash 1.2s linear infinite}
.sunOn.chloroOn #beam{opacity:.85}
@keyframes dash{to{stroke-dashoffset:-36}}

.vesicle{opacity:0;fill:rgba(255,181,167,.3);stroke:#FF9E8F;stroke-width:3;transition:opacity 1s,stroke .3s}
.vesA #bactA .vesicle,.vesC #bactC .vesicle{opacity:1}
.cristae,.thyl,.sparks,.sugar{opacity:0;transition:opacity .9s}
.mitoOn #bactA .cristae,.mitoOn #bactA .sparks{opacity:1}
.chloroOn #bactC .thyl,.chloroOn #bactC .sugar{opacity:1}
.spark{animation:floatup 2.4s ease-in infinite}
.spark:nth-child(2){animation-delay:.8s}
.spark:nth-child(3){animation-delay:1.6s}
@keyframes floatup{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}

.dnaRing,.ribo,.twin{opacity:0;transition:opacity .4s}
.evidence.ev-dna .dnaRing{opacity:1;stroke:var(--sun);stroke-width:3;animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.evidence.ev-ribo .ribo{opacity:1}
.evidence.ev-mem .vesicle{stroke:var(--sun);stroke-width:6;opacity:1}
.evidence.ev-div .bodyg{animation:splitBody 2s ease-in-out infinite}
.evidence.ev-div .twin{animation:splitTwin 2s ease-in-out infinite}
.evidence .cristae,.evidence .thyl{opacity:.2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes splitBody{0%,100%{transform:translateX(0) scaleX(1)}50%{transform:translateX(-17px) scaleX(.75)}}
@keyframes splitTwin{0%,100%{transform:translateX(0) scaleX(.75);opacity:0}50%{transform:translateX(17px) scaleX(.75);opacity:1}}

.lab{font:600 19px 'Fredoka',sans-serif;fill:#fff;stroke:#0E3A5C;stroke-width:5;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;opacity:0;animation:labIn .6s .7s forwards}
@keyframes labIn{to{opacity:1}}



/* ---------- Notebook shell ---------- */
:root{--red:#C8102E}
[hidden]{display:none!important}
.red{color:var(--red);font-weight:700}
.brand{background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;align-items:center;gap:12px;font:inherit;color:inherit;text-align:left}
.brand:focus-visible{outline:4px solid #FFD23F;outline-offset:4px;border-radius:12px}
.meter{margin-left:auto;display:flex;align-items:center;gap:10px;color:#fff;font:600 16px 'Fredoka',sans-serif}
.bar{width:150px;height:14px;border-radius:9px;background:rgba(255,255,255,.22);border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .4s}

.trail{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 16px;margin:0 0 4px}
.stop{flex:1 0 100px;min-width:94px;background:none;border:0;cursor:pointer;color:#fff;font:600 14px/1.15 'Fredoka',sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;position:relative}
.stop:not(:last-child)::after{content:"";position:absolute;top:27px;left:calc(50% + 28px);width:calc(100% - 56px);height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.pad{width:46px;height:46px;border-radius:50%;background:#CFE8EA;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;font:600 20px 'Fredoka',sans-serif;transition:transform .15s}
.stop:hover .pad{transform:translateY(-2px)}
.stop.done .pad,.pad.done{background:var(--leaf)}
.stop.cur .pad{background:var(--sun);outline:4px solid #fff;outline-offset:2px}
.stop.done.cur .pad{background:var(--leaf)}
.stop:focus-visible{outline:4px solid #FFD23F;outline-offset:2px;border-radius:12px}
.pad.small{width:34px;height:34px;font-size:16px;box-shadow:0 3px 0 var(--ink);flex:none}

.paper{background:#FFFDF6;border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
  padding:26px 36px 30px;max-width:1000px;margin:0 auto;line-height:1.6}
.paper h2{font:600 36px/1.15 'Fredoka',sans-serif;margin:4px 0 6px}
.paper h3{font:600 24px 'Fredoka',sans-serif;margin:24px 0 6px;padding-bottom:3px;border-bottom:3px dotted #B7D8DC}
.paper ul,.paper ol{margin:8px 0;padding-left:26px}
.paper li{margin:7px 0}
.kick{font:600 15px 'Fredoka',sans-serif;color:#3F7186;text-transform:uppercase;letter-spacing:.06em}
.lead{font-size:20px;margin:4px 0 10px}
.legend{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-size:16px;margin:4px 0 6px}
table.cmp{width:100%;border-collapse:collapse;margin:12px 0;font-size:17px}
table.cmp th{background:var(--ink);color:#fff;font:600 17px 'Fredoka',sans-serif;padding:8px 12px;text-align:left}
table.cmp td{border:2px solid var(--ink);padding:7px 12px;vertical-align:top;background:#fff}
table.cmp td:first-child{font-weight:700;background:#E8F7F5;color:var(--ink)}
.fig{margin:16px 0;background:#E6F7F7;border:3px solid var(--ink);border-radius:18px;padding:10px}
.fig svg{display:block;width:100%;height:auto}
.legendlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:16px}
.legendlist ol{margin:4px 0}
.strategies{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.strat{border:3px solid var(--ink);border-radius:16px;padding:12px 16px;background:#fff}
.strat b{display:block;font:600 20px 'Fredoka',sans-serif;color:var(--ink);margin-bottom:2px}
.qcard{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 16px;margin:12px 0}
.qcard.solved{background:#F1FBF0}
.qcard h4{font:600 19px/1.3 'Fredoka',sans-serif;margin:0 0 8px}
.qcard .opts{margin:8px 0}
.qcard .feedback{min-height:0}
.complete{background:#CDF5C6;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:12px}
.lnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn.small{font-size:16px;padding:6px 16px;box-shadow:0 3px 0 var(--ink)}
.plist{list-style:none;padding:0!important;display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;margin:0!important}
.pname{font:600 18px 'Fredoka',sans-serif;flex:1}
.pstat{font-size:15px;color:#3F7186;font-weight:700}

/* story panel (red notes) */
.panel .mini{font-size:14px;margin:6px 0 0}
.prog button{flex:1;height:14px;border-radius:7px;background:#CFE8EA;border:2px solid var(--ink);padding:0;cursor:pointer}
.prog button.on{background:var(--leaf)}
.prog button.cur{background:var(--sun)}
.prog button:focus-visible{outline:3px solid #7B4FD8;outline-offset:2px}
.vocab b{color:var(--red)}
.clue-text{color:var(--ink);font-weight:500}
.clue-text.ph{color:var(--ink);font-weight:500}
.blue{color:#1D5FD1;font-weight:600}
.kw{margin:6px 0 10px}
.kw .red{display:inline-block;background:#FFEAEE;border:2px solid var(--red);border-radius:999px;padding:1px 14px;margin:4px 8px 4px 0;font-size:18px}
ol.keys{padding-left:30px}
ol.keys li{margin:14px 0}
ol.keys li .red{display:inline-block;background:#FFEAEE;border:2px solid var(--red);border-radius:999px;padding:0 14px;font-size:19px;margin-bottom:3px}
.strat .red{display:inline-block;background:#FFEAEE;border:2px solid var(--red);border-radius:999px;padding:1px 14px;margin-top:4px}
.legend .red,.mini .red{font-weight:700}
.fig figcaption{font-size:15px;margin:8px 4px 2px;color:#2D4A60;text-align:center}
.fig.hero{padding:0;background:none;border:0;margin:14px 0}
.fig.hero svg{border-radius:20px;border:3px solid var(--ink)}
@media (max-width:700px){.strategies,.legendlist{grid-template-columns:1fr}.paper{padding:18px 16px}.meter{margin-left:0}}

.swimrow{display:flex;align-items:center;gap:14px;margin:10px 0 12px;flex-wrap:wrap}
.swimrow .found{margin:0}
.perk{background:#FFF8D6;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14.5px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:600 13px 'Fredoka',sans-serif;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.sel{background:var(--sun)}
.chip:focus-visible{outline:4px solid #7B4FD8;outline-offset:2px}
.chip .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
/* ---------- Cell Arena panel ---------- */
.goals{list-style:none;padding:0!important;margin:8px 0!important}
.goals li{display:flex;gap:8px;align-items:center;margin:5px 0!important;font-size:15px;line-height:1.3}
.gbox{width:20px;height:20px;border:3px solid var(--ink);border-radius:6px;background:#fff;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.gdone .gbox{background:var(--leaf)}
.pwlist{display:grid;gap:5px;margin:8px 0}
.pw{display:grid;grid-template-columns:16px 1fr auto auto;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:14px;opacity:.62}
.pw.have{opacity:1}
.pw .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pw .pn{font:600 15px 'Fredoka',sans-serif}
.pw .pk{font-size:12px;font-weight:700;color:#3F7186}
.pw .pips i.on{background:var(--c)}
.pw .pd{grid-column:1/-1;font-size:12.5px;line-height:1.3;color:#2D4A60}

/* ---------- Feeding minute ---------- */
#game{display:none;width:100%;height:auto;background:#16507A}
.stage-frame.playing #stage{display:none}
.stage-frame.playing #game{display:block}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#D8E8EA}
.tag{display:inline-block;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font:700 12px 'Nunito',sans-serif;margin-left:8px;vertical-align:middle}
.keys{font-size:15px}
.res{margin:8px 0 0;padding-left:26px;font-size:17px}
.res li{margin:2px 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .mover{transition-duration:.01s}
  .lab{opacity:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="brand" data-act="home" aria-label="Home">
      <span class="dot" aria-hidden="true"></span>
      <h1>How Cells Teamed Up</h1>
    </button>
    <div class="meter" aria-live="polite"><span id="meterTxt">0 of 7 stops done</span><div class="bar"><i id="meterFill"></i></div></div>
  </header>
  <nav class="trail" id="trail" aria-label="Lesson map"></nav>

  <article id="lesson" class="lesson"></article>

  <main id="gamegrid" hidden>
    <div class="stage-col">
    <div class="stage-frame" id="frame">
      <svg id="stage" viewBox="0 0 800 450" role="img" aria-label="A cartoon cell in a pond, swallowing bacteria that become its organelles">
        <defs>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4CC4D2"/><stop offset="1" stop-color="#16507A"/>
          </linearGradient>
          <radialGradient id="hostGrad" cx=".35" cy=".3" r=".9">
            <stop offset="0" stop-color="#FFE3D9"/><stop offset="1" stop-color="#FFA797"/>
          </radialGradient>
        </defs>
        <rect width="800" height="450" fill="url(#water)"/>
        <g aria-hidden="true">
          <circle class="bub" cx="60" cy="440" r="9" fill="#fff" style="animation-delay:-2s"/>
          <circle class="bub" cx="190" cy="450" r="5" fill="#fff" style="animation-delay:-7s"/>
          <circle class="bub" cx="330" cy="445" r="7" fill="#fff" style="animation-delay:-11s"/>
          <circle class="bub" cx="610" cy="450" r="10" fill="#fff" style="animation-delay:-4s"/>
          <circle class="bub" cx="730" cy="440" r="6" fill="#fff" style="animation-delay:-9s"/>
          <circle class="bub" cx="520" cy="450" r="4" fill="#fff" style="animation-delay:-13s"/>
        </g>

        <!-- Sun -->
        <g id="sun" transform="translate(70,70)">
          <g class="rays" id="rays"></g>
          <circle r="27" fill="#FFD23F" stroke="#E0A800" stroke-width="3"/>
          <circle cx="-9" cy="-4" r="3" fill="#12304A"/><circle cx="9" cy="-4" r="3" fill="#12304A"/>
          <path d="M-9,7 Q0,16 9,7" fill="none" stroke="#12304A" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <line id="beam" x1="100" y1="92" x2="438" y2="150" stroke="#FFD23F" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>

        <!-- Host cell -->
        <g transform="translate(400,225)">
          <g id="hostInner">
            <ellipse class="bulge" cx="175" cy="15" rx="62" ry="46" fill="url(#hostGrad)" stroke="#E4705F" stroke-width="6"/>
            <path d="M-170,0 C-170,-95 -90,-125 0,-125 C95,-125 170,-90 170,5 C170,100 90,125 0,122 C-95,120 -170,95 -170,0Z"
                  fill="url(#hostGrad)" stroke="#E4705F" stroke-width="6" stroke-linejoin="round"/>
            <!-- face -->
            <g>
              <g class="eye"><circle cx="-70" cy="-55" r="11" fill="#fff" stroke="#12304A" stroke-width="2.5"/><circle cx="-67" cy="-54" r="5.5" fill="#12304A"/></g>
              <g class="eye"><circle cx="-25" cy="-55" r="11" fill="#fff" stroke="#12304A" stroke-width="2.5"/><circle cx="-22" cy="-54" r="5.5" fill="#12304A"/></g>
              <circle cx="-88" cy="-36" r="7" fill="#FF8A8A" opacity=".55"/>
              <circle cx="-7" cy="-36" r="7" fill="#FF8A8A" opacity=".55"/>

<script>

(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';

  var frame = document.getElementById('frame');
  var canvas = document.getElementById('game');

  // sun rays
  (function(){
    var g = document.getElementById('rays');

      var l = document.createElementNS(NS, 'line');

  })();

  /* ------------------------------------------------------------------
     CONTENT
  ------------------------------------------------------------------ */
  var STORY = [
    { title: 'Life starts simple',
      body: ['Billions of years ago, every cell was tiny and simple. This ancestor cell has <span class="red">no nucleus</span>. Its DNA just floats around loose inside.'],
      vocab: ['Prokaryote:', 'a cell with no nucleus and no membrane-wrapped organelles.'] },
    { title: 'A new neighbor',
      body: ['A smaller bacterium floats nearby. It has a special trick: it <span class="red">uses oxygen</span> to turn food into lots of energy.', 'Our big cell is hungry...'],
      vocab: ['Aerobic:', 'uses oxygen to release energy from food.'] },
    { title: 'Gulp!',
      body: ['The big cell wraps around the bacterium and swallows it, the way a cell eats food.', 'Usually, a swallowed bacterium gets digested. But what if it did not?'],
      vocab: ['Engulf:', 'to wrap around something and take it inside.'] },
    { title: 'It survives!',
      body: ['Scientists think that some swallowed bacteria were not digested. They kept living inside the big cell. <span class="blue">They were wrapped in a membrane from the host.</span>'],
      vocab: ['Endosymbiosis:', '"endo" means inside, "symbiosis" means living together to help each other.'] },
    { title: 'A great trade',
      body: ['The bacterium makes extra energy for the cell. The cell gives it food and a safe home. Both win!', 'The bacterium became a <span class="red">mitochondrion</span>, the cell\u2019s power plant. <span class="blue">This took millions of years.</span>'],
      vocab: ['Mitochondrion:', 'an organelle that makes energy the cell can use. (Plural: mitochondria)'] },
    { title: 'A nucleus appears',
      body: ['Around this time, the cell also built a <span class="red">nucleus</span>, a membrane bag that protects the DNA.', 'A cell with a nucleus and organelles is no longer a prokaryote. It is a eukaryote!'],
      vocab: ['Eukaryote:', 'a cell with a nucleus and membrane-wrapped organelles.'] },
    { title: 'A sunlight snack',
      body: ['Later, our eukaryote meets another bacterium. This one is a <span class="red">cyanobacterium</span>. It can do photosynthesis: it uses sunlight to make sugar.'],
      vocab: ['Photosynthesis:', 'using sunlight to make sugar and oxygen.'] },
    { title: 'Gulp, round two',
      body: ['Just like before, the cell swallows it, and it survives. <span class="blue">Now the cell has a tiny sugar factory inside.</span>'] },
    { title: 'Meet the chloroplast',
      body: ['That bacterium became a <span class="red">chloroplast</span>. It makes food for the cell using sunlight.', 'Only <span class="red">plants and algae</span> have chloroplasts.'],
      vocab: ['Chloroplast:', 'an organelle that does photosynthesis.'] },
    { title: 'Detective time',
      body: ['How do we know this really happened? Scientists found clues that mitochondria and chloroplasts used to be bacteria. Check out all four clues.'] },
    { title: 'Cells today',
      body: ['All of this happened because of ancient teamwork. This idea is called the <span class="red">endosymbiotic theory</span>. <span class="blue">Lynn Margulis helped make it famous in 1967.</span>'] }
  ];

  var CLUES = [
    { key: 'dna',  name: 'Their own DNA', keyword: 'Own DNA',
      text: 'Mitochondria and chloroplasts have their own small, circular DNA, just like bacteria.',

    { key: 'mem',  name: 'Two membranes', keyword: 'Two membranes',
      text: 'They are wrapped in two membranes.',

    { key: 'ribo', name: 'Bacteria-like ribosomes', keyword: 'Bacteria-like ribosomes',

  var ENDO_CHECK = [

      why: 'Splitting in two on their own is one of the clues that they used to be bacteria.',

    { q: 'What kind of bacterium became the chloroplast?',

      why: 'Cyanobacteria use sunlight to make sugar, which is exactly what chloroplasts do.',

  ];

  var QUIZ = [
    { q: 'Which type of cell keeps its DNA inside a nucleus?',

  /* ---------- diagrams ---------- */

  function growthFigure(){
    var labels = ['Start', '20 min', '40 min', '1 hr', '1 hr 20', '1 hr 40', '2 hr', '2 hr 20', '2 hr 40'];
    var T = 'font-family="Fredoka,sans-serif" fill="#12304A" text-anchor="middle"';
    var s = '<svg viewBox="0 0 760 270" role="img" aria-label="Bar chart: one bacterium dividing every 20 minutes grows to 256 bacteria in 2 hours 40 minutes">';
    s += '<text x="380" y="26" font-size="19" font-weight="600" ' + T + '>One bacterium dividing every 20 minutes (ideal conditions)</text>';
    var base = 220, maxH = 150, bw = 52, gap = 26, x0 = 40;
    for (var i = 0; i < 9; i++){
      var n = Math.pow(2, i), h = Math.max(3, n / 256 * maxH), x = x0 + i * (bw + gap);
      s += '<rect x="' + x + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="6" fill="#FF6B6B" stroke="#C94444" stroke-width="2.5"/>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (base - h - 8) + '" font-size="16" font-weight="600" ' + T + '>' + n + '</text>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (base + 20) + '" font-size="13" ' + T + '>' + labels[i] + '</text>';
    }
    return s + '<line x1="30" y1="220" x2="740" y2="220" stroke="#12304A" stroke-width="3"/></svg>';

  function timelineFigure(){
    var X = function(t){ return Math.round(40 + (4.5 - t) / 4.5 * 800); };
    function ms(t, above, name, date, anchor){
      var x = X(t), a = anchor || 'middle', ty = above ? 62 : 158;
      var stem = above ? '<line x1="' + x + '" y1="84" x2="' + x + '" y2="112" stroke="#12304A" stroke-width="3"/>'
                       : '<line x1="' + x + '" y1="128" x2="' + x + '" y2="148" stroke="#12304A" stroke-width="3"/>';
      var lines = (typeof name === 'string') ? [name] : name, nt = '';
      for (var li = 0; li < lines.length; li++){
        nt += '<text x="' + x + '" y="' + (ty - (lines.length - 1 - li) * 20) + '" text-anchor="' + a + '" font-size="17" font-weight="600" ' + FT + '>' + lines[li] + '</text>';
      }
      return stem + '<circle cx="' + x + '" cy="120" r="10" fill="#fff" stroke="#12304A" stroke-width="3.5"/>' + nt +
        '<text x="' + x + '" y="' + (ty + 20) + '" text-anchor="' + a + '" font-size="14" ' + FT + '>' + date + '</text>';
    }
    return '<svg viewBox="0 0 900 250" role="img" aria-label="Timeline: Earth forms 4.5 billion years ago, first prokaryotes 3.5 billion, cyanobacteria make oxygen 2.4 billion, first eukaryotes about 2 billion, first many-celled life about 1.2 billion, then today">' +
      '<rect x="40" y="112" width="800" height="16" rx="8" fill="#CFE8EA" stroke="#12304A" stroke-width="3"/>' +
      '<rect x="' + X(3.5) + '" y="113.5" width="' + (X(2) - X(3.5)) + '" height="13" fill="#FF8A8A"/>' +
      ms(4.5, true, 'Earth forms', '4.5 billion years ago', 'start') +
      ms(3.5, false, 'First prokaryotes', '3.5 billion years ago') +
      ms(2.4, true, ['Cyanobacteria', 'make oxygen'], '2.4 billion years ago') +
      ms(2.0, false, 'First eukaryotes', 'about 2 billion years ago') +
      ms(1.2, true, 'First many-celled life', 'about 1.2 billion years ago') +
      ms(0, false, 'Today', '', 'end') +
      '<g stroke="#12304A" stroke-width="3" fill="none"><path d="M' + X(3.5) + ',192 v8 H' + X(2) + ' v-8"/></g>' +
      '<text x="' + Math.round((X(3.5) + X(2)) / 2) + '" y="224" text-anchor="middle" font-size="17" font-weight="600" ' + FT + '>Only prokaryotes for about 1.5 billion years</text>' +
      '</svg>';
  }

  function resolveEating(){

  function drawArenaCell(x, y, r, col, edge, lw, t, ang, label, eyes){

  function drawArena(){

    for (k = Math.max(0, Math.floor(y0 / 120) * 120); k <= Math.min(AH, y1); k += 120){ ctx.moveTo(Math.max(0, x0), k); ctx.lineTo(Math.min(AW, x1), k); }

      ctx.strokeStyle = p.z >= 0 ? (A.pw.x > 0 ? '#D9A400' : '#8E2208') : '#E0C85A'; ctx.lineWidth = (p.z >= 0 ? 2.2 : 1.5) / z; ctx.stroke();

  function pickCount(){ var n = 0; PKEYS.forEach(function(k){ if (ar.picks[k]) n++; }); return n; }
  function chipsHtml(){
    return PKEYS.map(function(k){
      var P = PWR[k], on = !!ar.picks[k];
      return '<button class="chip' + (on ? ' sel' : '') + '" data-act="apick" data-k="' + k + '" aria-pressed="' + on + '"><span class="dot" style="background:' + P.col + '"></span>' + P.name + '</button>';
    }).join('');
  }
  function pickHtml(){
    if (!bonus) return '<div class="perk"><b>Quiz bonus:</b> none yet. Score points on the Bonus Quiz to earn a head start! <button class="btn ghost small" data-act="quiz" style="margin-top:6px">Take the quiz</button></div>';
    var f = freeLevels(), extra = Math.max(0, bonus - 2);
    return '<div class="perk"><b>Quiz bonus (' + bonus + ' of 4):</b> pick ' + f + ' free starting power' + (f === 1 ? '' : 's') + '.' +
           (extra ? ' You also start bigger and protected longer.' : '') +
           ' <span id="arPickInfo">Picked ' + pickCount() + ' of ' + f + '.</span><div class="chips" id="arPick">' + chipsHtml() + '</div></div>';
  }
  function toggleArenaPick(k){
    if (!ar || ar.phase !== 'idle' || !PWR[k]) return;
    if (ar.picks[k]) delete ar.picks[k];
    else if (pickCount() < freeLevels()) ar.picks[k] = true;
    var el = document.getElementById('arPick'), info = document.getElementById('arPickInfo');
    if (el) el.innerHTML = chipsHtml();
    if (info) info.textContent = 'Picked ' + pickCount() + ' of ' + freeLevels() + '.';
  }
  function arenaPerkLine(sc){
    if (!sc) return '';
    var f = Math.min(sc, 2), extra = Math.max(0, sc - 2);
    return '<p class="words">Cell Arena head start: ' + f + ' free starting power' + (f === 1 ? '' : 's') + (extra ? ', plus a bigger start and longer protection' : '') + '.</p>';
  }

  function renderArenaIntro(){
    leaveGame();
    mode = 'arena'; scene = 'arena';
    frame.classList.add('playing');
    canvas.style.cursor = 'crosshair';
    newArena(null);
    startLoop();
    panel.setAttribute('aria-live', 'polite');
    panel.innerHTML =
      '<div class="content"><h2>Cell Arena</h2>' +
      '<p>Eat smaller cells to grow, and run from bigger ones! Every wild cell carries a power. When you eat one, its power moves into your cell, just like endosymbiosis.</p>' +
      '<p class="keys"><b>Steer:</b> move the mouse (or use W A S D / arrow keys). <b>Shift</b> burst, <b>E</b> lunge, <b>Space</b> split in two (binary fission, then mitosis once you have a nucleus), <b>Q</b> spore. Split pieces move faster and you steer them all. The pond is huge, so use the minimap to explore!</p>' +
      pickHtml() +
      '<div class="nav" style="margin:10px 0 14px"><button class="btn ghost" data-act="home">Menu</button>' +
      '<button class="btn big" data-act="astart">Start!</button></div>' +
      '<div id="arSide"></div></div>';
    ar.sig = ''; updateArenaPanel();
  }

  function startArena(){
    if (!ar || ar.phase !== 'idle') return;
    var extra = Math.max(0, bonus - 2), got = [];
    PKEYS.forEach(function(k){ if (ar.picks[k] && ar.pw[k] < 1){ ar.pw[k] = 1; got.push(PWR[k].name); } });
    ar.cells[0].mass = 24 + 12 * extra;
    ar.energy = maxE();
    ar.phase = 'play'; ar.protectT = 4 + 3 * extra;
    toTop();
    if (got.length || extra) setArBanner('Quiz head start!', (got.length ? 'You start with ' + got.join(' and ') : 'You start bigger') + (got.length && extra ? ', and bigger.' : '.'));
    else setArBanner(ar.pw.m ? 'Find cells to eat!' : 'Find a red bacterium!', ar.pw.m ? 'Collect 5 different powers.' : 'Eat one to install mitochondria.');
    renderArenaPlayPanel();
  }

  /* ---------- the win screen: survival of the fittest ---------- */
  function startArenaEvo(){
    var n = pcount(), seen = {}, types = [], i;
    // the three biggest kinds of wild cell in the pond, each of which has just one power
    var alive = ar.bots.filter(function(b){ return b.dead <= 0 && b.type !== 'd'; }).sort(function(a, b){ return b.mass - a.mass; });
    for (i = 0; i < alive.length && types.length < 3; i++){
      if (!seen[alive[i].type]){ seen[alive[i].type] = true; types.push(alive[i].type); }
    }
    var pool = ['m', 'c', 'f', 'i', 'p', 's', 'x'].filter(function(t){ return !seen[t]; });
    while (types.length < 3 && pool.length) types.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    var groups = [{ name: 'You: eukaryote, ' + n + ' powers', col: '#FFA797', edge: '#E4705F', nuc: true, rounds: 6, you: true }];
    types.forEach(function(t, k){
      var P = PWR[t];
      groups.push({ name: P.cell + ' (1 power)', col: P.col, edge: P.edge, nuc: t === 'i' || t === 'p', rounds: 5 - k, type: t });
    });
    var boxes = [[10, 46], [410, 46], [10, 250], [410, 250]];
    ar.evo = { t: 0, ponds: [], doneT: .9 + 5 + 1.6 };
    groups.forEach(function(g, gi){
      ar.evo.ponds.push({ g: g, rounds: g.rounds, gen: 0, nextT: .9, bx: boxes[gi][0], by: boxes[gi][1], w: 380, h: 190,
                          cells: [{ x: boxes[gi][0] + 190, y: boxes[gi][1] + 105, vx: 0, vy: 0, born: -1 }] });
    });
  }

  function updateArenaEvo(dt){
    var E = ar.evo, i, j;
    E.t += dt;
    E.ponds.forEach(function(P){
      var cs = P.cells, rad = 9;
      if (P.gen < P.rounds && E.t >= P.nextT){
        P.gen++; P.nextT += 1;
        var n = cs.length;
        for (i = 0; i < n; i++){
          var c0 = cs[i], a = rnd(0, 6.283), ca = Math.cos(a) * 70, sa = Math.sin(a) * 70;
          cs.push({ x: c0.x, y: c0.y, vx: ca, vy: sa, born: E.t });
          c0.vx -= ca; c0.vy -= sa; c0.born = E.t;
        }
      }
      var damp = Math.exp(-2.2 * dt);
      for (i = 0; i < cs.length; i++){
        var c = cs[i];
        c.vx = c.vx * damp + rnd(-1, 1) * 22 * dt; c.vy = c.vy * damp + rnd(-1, 1) * 22 * dt;
      }
      for (i = 0; i < cs.length; i++){
        for (j = i + 1; j < cs.length; j++){
          var dx = cs[j].x - cs[i].x, dy = cs[j].y - cs[i].y, d2 = dx * dx + dy * dy, m = rad * 2;
          if (d2 < m * m && d2 > .01){
            var d = Math.sqrt(d2), push = (m - d) / 2 * Math.min(1, dt * 12), nx = dx / d, ny = dy / d;
            cs[i].x -= nx * push; cs[i].y -= ny * push; cs[j].x += nx * push; cs[j].y += ny * push;
          }
        }
      }
      for (i = 0; i < cs.length; i++){
        var q = cs[i];
        q.x = clamp(q.x + q.vx * dt, P.bx + rad + 4, P.bx + P.w - rad - 4);
        q.y = clamp(q.y + q.vy * dt, P.by + 34, P.by + P.h - rad - 4);
      }
    });
  }

  function drawArenaEvo(){
    var E = ar.evo, i;
    var gr = ctx.createLinearGradient(0, 0, 0, GH);
    gr.addColorStop(0, '#16507A'); gr.addColorStop(1, '#0B2A44');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, GW, GH);
    outlined('Survival of the fittest!', GW / 2, 24, 30, '#FFD23F');
    var showWin = E.t > E.doneT;
    E.ponds.forEach(function(P){
      var g = P.g, you = !!g.you;
      var pg = ctx.createLinearGradient(0, P.by, 0, P.by + P.h);
      pg.addColorStop(0, '#3FA9C0'); pg.addColorStop(1, '#1B6585');
      rrect(P.bx, P.by, P.w, P.h, 16); ctx.fillStyle = pg; ctx.fill();
      ctx.lineWidth = (showWin && you) ? 6 : 3; ctx.strokeStyle = (showWin && you) ? '#FFD23F' : '#12304A'; ctx.stroke();
      for (i = 0; i < P.cells.length; i++){
        var c = P.cells[i], age = c.born < 0 ? 9 : E.t - c.born, sc = clamp(.5 + age * 1.1, .5, 1), r = 9 * sc;
        var sq = 1 + .3 * (1 - clamp(age * 2, 0, 1));
        ctx.save(); ctx.translate(c.x, c.y); ctx.scale(sq, 1 / sq);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fillStyle = g.col; ctx.fill();
        ctx.strokeStyle = g.edge; ctx.lineWidth = 2; ctx.stroke();
        if (g.nuc) circ(r * .1, r * .35, r * .3, '#8E6BE0');
        circ(-r * .3, -r * .25, r * .26, '#fff'); circ(r * .3, -r * .25, r * .26, '#fff');
        circ(-r * .3, -r * .22, r * .12, '#12304A'); circ(r * .3, -r * .22, r * .12, '#12304A');
        ctx.restore();
      }
      outlined(g.name, P.bx + 12, P.by + 18, 17, '#fff', 'left');
      outlined(P.cells.length + ' cells', P.bx + P.w - 12, P.by + 18, 17, '#FFD23F', 'right');
      if (showWin && you){
        star(P.bx + P.w / 2 - 50, P.by + P.h - 20, 12);
        outlined('YOU WIN!', P.bx + P.w / 2 + 12, P.by + P.h - 19, 24, '#FFD23F');
      }
    });
  }

  function renderArenaWin(){
    panel.setAttribute('aria-live', 'polite');
    var list = PKEYS.filter(function(k){ return ar.pw[k] > 0; }).map(function(k){
      var P = PWR[k];
      return '<li><b>' + P.name + '</b>' + (P.real ? ' <span class="red">endosymbiosis</span>' : '') + '<br><span class="blue">' + P.short + '</span></li>';
    }).join('');
    panel.innerHTML =
      '<div class="content"><h2>You evolved!</h2>' +
      '<p>You became a <b>modern eukaryote</b> with ' + pcount() + ' powers' + (ar.deaths ? ', even after being eaten ' + ar.deaths + ' time' + (ar.deaths === 1 ? '' : 's') : '') + '. Only mitochondria and chloroplasts really came from endosymbiosis.</p>' +
      '<div class="swimrow"><button class="btn big" data-act="akeep">Keep playing</button>' +
      '<span class="found">Free play: keep growing and become the biggest cell!</span></div>' +
      '<p>Watch the screen: you collected <b>' + pcount() + ' powers</b>, and each wild cell has just <b>1</b>. <b>Cells with more helpful traits survive better and reproduce more.</b></p>' +
      '<p><span class="blue">This is natural selection. Endosymbiosis gave eukaryotes mitochondria, and the extra energy helped them thrive.</span></p>' +
      '<ul class="res">' + list + '</ul></div>' +
      '<div class="nav"><button class="btn ghost" data-act="home">Menu</button>' +
      '<button class="btn ghost" data-act="aevo">Watch again</button>' +
      '<button class="btn" data-act="agame">Play again</button></div>';
  }

  function keepPlaying(){
    if (!ar || ar.phase !== 'won') return;
    ar.phase = 'play'; ar.protectT = 3; ar.evo = null;
    setArBanner('Free play!', 'You are a modern eukaryote. Become the biggest cell!');
    renderArenaPlayPanel();
  }

  canvas.addEventListener('pointermove', function(e){
    if (!ar || mode !== 'arena') return;
    ar.mouse = ptrPos(e);
  });
  canvas.addEventListener('pointerdown', function(e){
    if (!ar || mode !== 'arena' || ar.phase !== 'play') return;
    var p = ptrPos(e), list = abilityList();
    for (var n = 0; n < list.length; n++){
      var R = chipRect(n);
      if (p.x >= R.x && p.x <= R.x + R.w && p.y >= R.y && p.y <= R.y + R.h){ arenaKey(CHIP_KEY[list[n]]); return; }
    }
  });

  function onKey(e, down){
    if (mode !== 'arena' || !ar) return;
    var k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) !== -1) e.preventDefault();
    ar.keys[k] = down;
    if (down && !e.repeat && k === 'f'){ toggleFullscreen(); return; }
    if (ar.phase === 'story' && down && k === 'enter'){ continueStory(); return; }
    if (down && !e.repeat) arenaKey(k);
  }
  window.addEventListener('keydown', function(e){ onKey(e, true); });
  window.addEventListener('keyup', function(e){ onKey(e, false); });
  window.addEventListener('blur', function(){ if (ar) ar.keys = {}; });

  /* ------------------------------------------------------------------
     EVENTS + START
  ------------------------------------------------------------------ */
  function onClick(e){
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'go'){ go(b.getAttribute('data-stop')); }
    else if (act === 'home'){ renderHome(); }
    else if (act === 'reset'){
      if (window.confirm('Erase all progress on this computer?')){
        P = defaultP(); saveP(); viewed = {}; currentClue = null; idx = 0;
        bonus = 0; QS = {};
        renderHome();
      }
    }
    else if (act === 'qans'){ qAnswer(b.getAttribute('data-stop'), parseInt(b.getAttribute('data-q'), 10), parseInt(b.getAttribute('data-i'), 10)); }
    else if (act === 'step'){ idx = parseInt(b.getAttribute('data-i'), 10); renderStory(); }
    else if (act === 'back'){ if (idx === 0) go('euk'); else { idx--; renderStory(); } }
    else if (act === 'next'){ if (idx === STORY.length - 1) renderStoryCheck(); else { idx++; renderStory(); } }
    else if (act === 'clue'){
      var key = b.getAttribute('data-key');
      currentClue = key; viewed[key] = true; P.viewed = viewed; saveP(); setEv(key); renderStory();
      var again = panel.querySelector('.clue[data-key="' + key + '"]');
      if (again) again.focus();
    }
    else if (act === 'answer'){ answer(parseInt(b.getAttribute('data-i'), 10)); }
    else if (act === 'qnext'){ if (qi === QUIZ.length - 1) renderResults(); else { qi++; renderQuiz(); } }
    else if (act === 'quiz'){ go('quiz'); }
    else if (act === 'astart'){ startArena(); }
    else if (act === 'agame'){ go('arena'); }
    else if (act === 'apick'){ toggleArenaPick(b.getAttribute('data-k')); }
    else if (act === 'akeep'){ keepPlaying(); }
    else if (act === 'aevo'){ if (ar && ar.phase === 'won') startArenaEvo(); }
    else if (act === 'astory'){ continueStory(); }
    else if (act === 'arespawn'){ if (ar && ar.phase === 'dead' && ar.deadT >= ar.lock) respawnPlayer(); }
  }
  document.addEventListener('click', onClick);

  document.addEventListener('keydown', function(e){
    if (mode !== 'story') return;
    if (e.key === 'ArrowRight'){
      var n = panel.querySelector('[data-act="next"]');
      if (n && !n.disabled) n.click();
    } else if (e.key === 'ArrowLeft'){
      var p = panel.querySelector('[data-act="back"]');
      if (p) p.click();
    }
  });

  bonus = P.quizBest | 0;
  renderHome();
})();
</script>
</body>
</html>
